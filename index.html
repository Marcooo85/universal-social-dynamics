<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNIVERSAL LSA</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif;margin:0;padding:0}
body{background:#E6EEF7}
header{background:#5B7DB1;color:#fff;padding:16px 20px;font-weight:800;display:flex;justify-content:space-between;border-radius:0 0 18px 18px}
#cont{max-width:480px;margin:0 auto;padding:0 14px 30px}
#videoBox{width:100%;height:380px;margin:18px auto 0;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 8px 30px rgba(91,125,177,.15);border:4px solid #fff}
canvas{display:block;width:100%;height:100%}
#btnGif{width:100%;background:#5B7DB1;color:#fff;border:none;border-radius:14px;padding:16px;font-weight:800;margin:14px 0}
.box{background:#fff;border-radius:16px;padding:18px;margin:18px 0;box-shadow:0 4px 15px rgba(91,125,177,.1)}
</style>
</head>
<body>
<header><span>← UNIVERSAL LSA</span><span>•••</span></header>
<div id="cont">
<div style="margin:16px 4px 0;font-weight:800;color:#2C3E66">Traductor LSA en vivo</div>
<div id="videoBox"><canvas id="c" width="480" height="380"></canvas></div>
<button id="btnGif" onclick="compartir()">⬆ COMPARTIR VIDEO LSA</button>
<div style="display:flex;gap:10px"><button style="flex:1;background:#C5D3E8;border:none;border-radius:24px;padding:10px">🎤 Hablar</button><button style="flex:1;background:#C5D3E8;border:none;border-radius:24px;padding:10px" onclick="compartirLink()">↗ Compartir</button></div>
<div style="display:flex;margin-top:12px;background:#fff;border-radius:12px;padding:12px;border:1px solid #D6E2F0"><input id="txt" style="flex:1;border:none;outline:none" placeholder="Escribe tu mensaje..."><button onclick="grabar()" style="border:none;background:none;color:#5B7DB1;font-weight:800;font-size:20px">➤</button></div>
<div id="frase" style="margin:10px 4px;font-weight:600;color:#2C3E66">Hola, bienvenidos a Universal</div>
<div class="box"><b>Apoyá el proyecto</b><div style="display:flex;justify-content:space-between;background:#EDF2FB;padding:10px;border-radius:10px;margin:8px 0"><span style="font-weight:700">MHERRERA4872.NX.ARS</span><button onclick="navigator.clipboard.writeText('MHERRERA4872.NX.ARS')" style="background:#5B7DB1;color:#fff;border:none;padding:6px 12px;border-radius:6px">Copiar</button></div><div style="display:flex;justify-content:space-between;background:#EDF2FB;padding:10px;border-radius:10px"><span style="font-weight:700">MHERRERA8437.NX.USD</span><button onclick="navigator.clipboard.writeText('MHERRERA8437.NX.USD')" style="background:#fff;color:#5B7DB1;border:1px solid #5B7DB1;padding:6px 12px;border-radius:6px">Copiar</button></div></div>
</div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');let blob=null,chunks=[],mr=null,t=0;
function draw(){x.clearRect(0,0,480,380);x.fillStyle="#fff";x.fillRect(0,0,480,380);let m=Math.sin(t*0.05)*18;t++;x.fillStyle="#E6C2A8";x.beginPath();x.arc(240,105,40,0,6.28);x.fill();x.fillStyle="#2B3A4E";x.beginPath();x.arc(240,82,42,3.14,6.28);x.fill();x.fillStyle="#A8C0E0";x.fillRect(195,145,90,110);x.fillStyle="#5B7DB1";x.fillRect(170,150,24,110);x.fillRect(286,150,24,110);x.strokeStyle="#5B7DB1";x.lineWidth=18;x.lineCap="round";x.beginPath();x.moveTo(182,160);x.lineTo(125+m,210);x.lineTo(110+m,260);x.stroke();x.beginPath();x.moveTo(298,160);x.lineTo(355-m,210);x.lineTo(370-m,260);x.stroke();x.fillStyle="#E6C2A8";x.beginPath();x.arc(110+m,272,16,0,6.28);x.arc(370-m,272,16,0,6.28);x.fill();requestAnimationFrame(draw)}draw();
function grabar(){let f=document.getElementById('txt').value||"Hola bienvenidos a Universal";document.getElementById('frase').innerText=f;let stream=cv.captureStream(25);chunks=[];mr=new MediaRecorder(stream);mr.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};mr.onstop=()=>{blob=new Blob(chunks,{type:'video/webm'});document.getElementById('btnGif').innerText="✅ VIDEO LISTO - COMPARTIR"};mr.start();document.getElementById('btnGif').innerText="⏺️ GRABANDO...";setTimeout(()=>{mr.stop()},3500)}
async function compartir(){if(!blob){alert("Escribí y dale ➤ primero");return}let file=new File([blob],"universal.webm",{type:"video/webm"});if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:"Universal LSA"});return}catch(e){}}let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download="universal-lsa.webm";a.click()}
function compartirLink(){let u="https://marcooo85.github.io/universal-social-dynamics/";if(navigator.share){navigator.share({title:"Universal LSA",url:u})}else{window.open("https://wa.me/?text="+encodeURIComponent(u),"_blank")}}
</script>
</body>
</html>
