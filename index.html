<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNIVERSAL SOCIAL DYNAMICS - LSA</title>
<style>
  body{margin:0;background:#f0f4ff;font-family:Arial;text-align:center}
  header{background:#0a1931;color:white;padding:12px;font-weight:bold}
  #escena{height:280px;display:flex;justify-content:center;align-items:center;background:white;margin:15px;border-radius:20px}
 .muneco{position:relative;width:120px;height:220px}
 .cabeza{width:50px;height:50px;background:#ffdbac;border-radius:50%;margin:0 auto;border:3px solid #333;position:relative;z-index:2}
 .cuerpo{width:4px;height:70px;background:#333;margin:0 auto}
 .brazo{position:absolute;top:60px;width:4px;height:60px;background:#e74c3c;transform-origin:top center;border-radius:2px;transition:0.4s}
 .brazo.izq{left:32px;background:#3498db;transform:rotate(30deg)}
 .brazo.der{right:32px;background:#3498db;transform:rotate(-30deg)}
 .pierna{position:absolute;top:125px;width:4px;height:65px;background:#2ecc71;transform-origin:top center;border-radius:2px}
 .pierna.izq{left:48px;transform:rotate(15deg)}
 .pierna.der{right:48px;transform:rotate(-15deg)}
 .saludo.brazo.der{transform:rotate(-150deg)!important;animation:saludar 0.5s infinite alternate}
 .noche.brazo.izq{transform:rotate(60deg)!important}
 .noche.brazo.der{transform:rotate(-60deg)!important}
 .noche.cabeza{transform:rotate(20deg)}
 .si.cabeza{animation:si 0.3s infinite alternate}
 .no.cabeza{animation:no 0.3s infinite alternate}
  @keyframes saludar{from{transform:rotate(-130deg)}to{transform:rotate(-170deg)}}
  @keyframes si{from{transform:translateY(0)}to{transform:translateY(8px)}}
  @keyframes no{from{transform:rotate(-15deg)}to{transform:rotate(15deg)}}
  #panel{margin:10px;padding:10px}
  #texto{width:70%;padding:12px;border-radius:10px;border:2px solid #0a1931;font-size:16px}
  #btn{padding:12px 18px;background:#0a1931;color:white;border:none;border-radius:10px;margin-left:5px}
  #estado{background:#0a1931;color:white;padding:10px;border-radius:10px;margin:10px;font-weight:bold;min-height:20px}
  #log{background:#e8eeff;padding:8px;border-radius:10px;font-size:13px;text-align:left}
</style>
</head>
<body>
<header>UNIVERSAL SOCIAL DYNAMICS - LSA REAL</header>
<div id="escena"><div id="muneco" class="muneco"><div class="cabeza"></div><div class="brazo izq"></div><div class="brazo der"></div><div class="cuerpo"></div><div class="pierna izq"></div><div class="pierna der"></div></div></div>
<div id="estado">FIN</div>
<div id="panel"><input id="texto" value="Hola buenas noches" placeholder="Escribí acá"><button id="btn" onclick="traducir()">▶</button><div id="log"></div></div>
<script>
let palabras=[], indice=0, timer=null;
const diccionario={"hola":"saludo","buenas":"saludo","chau":"saludo","adios":"saludo","noches":"noche","noche":"noche","dormir":"noche","si":"si","sí":"si","no":"no"};
function traducir(){
  clearInterval(timer);
  let texto=document.getElementById('texto').value.toLowerCase().replace(/[?¿!¡.,]/g,'');
  palabras=texto.split(' ').filter(p=>p.trim()!='');
  indice=0;
  document.getElementById('log').innerHTML="Quedan: "+palabras.join(', ');
  if(palabras.length>0) siguiente();
}
function siguiente(){
  if(indice>=palabras.length){
    document.getElementById('estado').innerText="FIN";
    document.getElementById('muneco').className="muneco";
    return;
  }
  let palabra=palabras[indice];
  let gesto=diccionario[palabra] || "otra";
  document.getElementById('estado').innerText=palabra.toUpperCase()+" → "+gesto.toUpperCase();
  let m=document.getElementById('muneco');
  m.className="muneco "+gesto;
  if(gesto=="otra"){ m.className="muneco"; }
  document.getElementById('log').innerHTML="Ahora: <b>"+palabra.toUpperCase()+" = "+gesto.toUpperCase()+"</b><br>Quedan: "+palabras.slice(indice+1).join(', ');
  indice++;
  timer=setTimeout(siguiente, 1500);
}
</script>
</body>
</html>
