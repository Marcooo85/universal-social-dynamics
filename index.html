<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universal - Traductor LSA</title>
<style>
*{box-sizing:border-box;font-family:sans-serif;margin:0;padding:0}
body{background:#000;color:#fff;text-align:center;padding-bottom:20px}
header{background:#ddd;color:#111;padding:12px;font-weight:bold}
#videoBox{position:relative;width:96%;max-width:520px;height:520px;margin:10px auto;background:#000;border:4px solid #fff;border-radius:18px;overflow:hidden}
#videoBox iframe{width:100%;height:110%;border:none;margin-top:-30px;filter:contrast(180%) brightness(130%)}
#overlayBotones{position:absolute;bottom:8px;right:8px;display:flex;gap:8px}
.btnCirculo{width:48px;height:48px;border-radius:50%;border:none;background:#FFD600;color:#000;font-size:22px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px #000}
.btn{padding:14px;width:96%;max-width:520px;margin:6px auto;border:none;border-radius:12px;font-size:16px;font-weight:bold;display:block;cursor:pointer}
.btn1{background:#e0e0e0;color:#111}
.aliasBox{display:flex;justify-content:space-between;align-items:center;background:#111;border:1px dashed #555;border-radius:10px;padding:10px;margin:8px 0}
</style>
</head>
<body>
<header>UNIVERSAL SOCIAL DYNAMICS</header>

<div id="videoBox">
  <iframe id="avatar" src="https://sign.mt/?text=Hola,%20bienvenidos&lang=ase"></iframe>
  <div id="overlayBotones">
    <button class="btnCirculo" onclick="descargarFrase()" title="Descargar">⬇️</button>
    <button class="btnCirculo" onclick="compartirFrase()" title="Compartir">🔗</button>
  </div>
</div>

<p id="texto" style="color:#FF6D00;font-weight:bold;margin:6px">Hola, bienvenidos</p>

<button id="grabar" class="btn btn1">🎤 TOCAR PARA HABLAR</button>
<input id="escribir" style="width:96%;max-width:520px;padding:12px;border-radius:10px;background:#111;color:#fff;border:2px solid #444" placeholder="Escribí: hola, gracias">
<button id="btnT" class="btn btn1">GENERAR VIDEO LSA ▶️</button>

<div style="width:96%;max-width:520px;margin:10px auto;background:#111;padding:12px;border-radius:12px;text-align:left">
<p style="text-align:center;font-weight:bold">🙏 APOYÁ EL PROYECTO</p>

<div class="aliasBox">
<span id="a1" style="font-weight:bold;font-size:14px">MHERRERA4872.NX.ARS</span>
<button onclick="copiar('MHERRERA4872.NX.ARS')" style="background:#FF6D00;color:#fff;border:none;padding:8px 12px;border-radius:8px;font-weight:bold">COPIAR</button>
</div>
<div class="aliasBox">
<span id="a2" style="font-weight:bold;font-size:14px">MHERRERA8437.NX.USD</span>
<button onclick="copiar('MHERRERA8437.NX.USD')" style="background:#00D26A;color:#fff;border:none;padding:8px 12px;border-radius:8px;font-weight:bold">COPIAR</button>
</div>

<button onclick="compartirFrase()" class="btn" style="background:#25D366;color:white;margin-top:12px">📤 COMPARTIR CON WHATSAPP / INSTAGRAM</button>
<p id="ok" style="text-align:center;color:#0f0;font-size:12px;display:none">✅ Copiado!</p>
</div>

<script>
let ultima="Hola, bienvenidos";
function generar(f){if(!f)return;ultima=f;document.getElementById('texto').innerText=f;document.getElementById('avatar').src="https://sign.mt/?text="+encodeURIComponent(f)+"&lang=ase";}

function copiar(t){navigator.clipboard.writeText(t);let o=document.getElementById('ok');o.innerText="✅ Copiado: "+t;o.style.display='block';setTimeout(()=>o.style.display='none',2000);}

function compartirFrase(){
  let url="https://marcooo85.github.io/universal-social-dynamics/";
  let txt="Mirá este traductor LSA: '"+ultima+"' - Probalo acá: "+url;
  if(navigator.share){
    navigator.share({title:"Traductor LSA",text:txt,url:url});
  } else {
    window.open("https://wa.me/?text="+encodeURIComponent(txt),"_blank");
  }
}

function descargarFrase(){
  let blob=new Blob(["Frase LSA: "+ultima+"\nLink: https://marcooo85.github.io/universal-social-dynamics/"],{type:"text/plain"});
  let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download="frase-lsa.txt";a.click();
  alert("Se descargó la frase: "+ultima);
}

let rec=null;try{rec=new(window.SpeechRecognition||window.webkitSpeechRecognition)();rec.lang='es-AR'}catch{}
if(rec){rec.onresult=e=>generar(e.results[0][0].transcript);document.getElementById('grabar').onclick=()=>{try{rec.start()}catch{}};}
document.getElementById('btnT').onclick=()=>generar(document.getElementById('escribir').value);
</script>
</body>
</html>
