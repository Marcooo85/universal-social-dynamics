<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universal - Video LSA REAL</title>
<style>
*{box-sizing:border-box;font-family:sans-serif;margin:0;padding:0}
body{background:#070712;color:white;text-align:center}
header{background:#00c800;padding:12px;font-weight:bold}
#videoBox{width:94%;max-width:500px;height:500px;margin:10px auto;background:black;border:3px solid #00c800;border-radius:16px;overflow:hidden;position:relative}
#videoBox iframe{width:100%;height:100%;border:none}
.btn{padding:20px;width:94%;max-width:500px;margin:8px auto;background:#00c800;color:white;border:none;border-radius:14px;font-size:20px;font-weight:bold}
input{width:94%;max-width:500px;padding:16px;border-radius:12px;border:none;font-size:18px;margin-top:8px}
#texto{padding:10px;min-height:30px;font-size:18px}
</style>
</head>
<body>
<header>UNIVERSAL SOCIAL DYNAMICS - Video LSA Real</header>
<div id="videoBox"><iframe id="avatar" src="https://sign.mt/?text=Hola"></iframe></div>
<p id="texto">Tocá el micrófono y decí algo...</p>
<button id="grabar" class="btn">🎤 TOCAR PARA HABLAR Y GENERAR VIDEO LSA</button>
<input id="escribir" placeholder="O escribí: hola gracias">
<button id="btnT" class="btn" style="background:#2222ff">GENERAR VIDEO LSA REAL ▶️</button>

<script>
const iframe=document.getElementById('avatar');
const txt=document.getElementById('texto');
const btn=document.getElementById('grabar');
const input=document.getElementById('escribir');
const btnT=document.getElementById('btnT');
let rec=null; let escuchando=false;

function generarVideoReal(frase){
 if(!frase) return;
 txt.innerText="Generando video LSA real para: "+frase;
 let textoParaURL=encodeURIComponent(frase);
 // sign.mt es el traductor mundial con avatar 3D real
 iframe.src="https://sign.mt/?text="+textoParaURL+"&lang=ase";
}

try{
 rec=new (window.SpeechRecognition||window.webkitSpeechRecognition)();
 rec.lang='es-AR';
}catch(e){}

if(rec){
 rec.onstart=()=>{escuchando=true;btn.innerText="🔴 ESCUCHANDO... SOLTÁ";btn.style.background="red";};
 rec.onend=()=>{escuchando=false;btn.innerText="🎤 TOCAR PARA HABLAR Y GENERAR VIDEO LSA";btn.style.background="#00c800";};
 rec.onresult=(e)=>{let t=e.results[0][0].transcript; generarVideoReal(t);};
 rec.onerror=(e)=>{txt.innerText="Error mic: "+e.error+" - Si estás grabando pantalla, parala y usá el teclado abajo";};
 btn.onclick=()=>{if(!escuchando){try{rec.start()}catch{}}else{try{rec.stop()}catch{}}};
}
btnT.onclick=()=>{generarVideoReal(input.value);};
</script>
</body>
</html>
