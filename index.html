<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio a Señas - Por Marco</title>
</head>
<body style="font-family:sans-serif;text-align:center;padding-top:30px">
<h2>🎤 Audio a Lengua de Señas</h2>
<p>Idea Original de Marco - 10/08/2026</p>
<button id="grabar" style="padding:20px;font-size:22px;background:#00c800;color:white;border-radius:15px;border:none">TOCAR PARA HABLAR</button>
<p id="texto" style="margin-top:20px;font-weight:bold"></p>
<div id="senas" style="margin-top:20px;font-size:26px"></div>
<script>
const btn=document.getElementById('grabar');
const textoP=document.getElementById('texto');
const senasDiv=document.getElementById('senas');
let rec=new (window.SpeechRecognition||window.webkitSpeechRecognition)();
rec.lang='es-AR';
let escuchando=false;
function iniciar(){if(escuchando)return;rec.start()}
function parar(){try{rec.stop()}catch(e){}}
btn.addEventListener('touchstart',(e)=>{e.preventDefault();iniciar()});
btn.addEventListener('touchend',(e)=>{e.preventDefault();parar()});
btn.addEventListener('mousedown',iniciar);
btn.addEventListener('mouseup',parar);
btn.onclick=()=>{if(escuchando)parar();else iniciar()};
rec.onstart=()=>{escuchando=true;btn.innerText="🔴 ESCUCHANDO";textoP.innerText="Escuchando...";btn.style.background="red"};
rec.onend=()=>{escuchando=false;btn.innerText="TOCAR PARA HABLAR";btn.style.background="#00c800"};
rec.onresult=(e)=>{
let t=e.results[0][0].transcript;
textoP.innerText="Dijiste: "+t;
senasDiv.innerHTML="🤟 Traduciendo a LSA:<br><b>"+t.toUpperCase()+"</b> 👏";
};
</script>
</body>
</html>
