<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNIVERSAL SOCIAL DYNAMICS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:#EEF2F7}
.app{max-width:430px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,.1)}
.header{background:#1E3A5F;color:#fff;padding:28px 20px 22px;text-align:center}
.header h1{font-size:22px;font-weight:800;line-height:1.1;letter-spacing:.5px}
.content{padding:18px 16px 30px}
.label{font-weight:700;color:#2C3E66;font-size:15px;margin-bottom:12px}
.videoBox{width:100%;height:230px;background:#000;border-radius:14px;overflow:hidden;position:relative;box-shadow:0 8px 25px rgba(0,0,0,.15)}
.videoBox canvas{width:100%;height:100%;display:block}
.badge{position:absolute;top:10px;left:10px;background:#2C4A7A;color:#fff;font-size:10px;font-weight:700;padding:5px 10px;border-radius:20px}
.timer{position:absolute;bottom:10px;left:10px;right:10px;display:flex;justify-content:space-between;color:#fff;font-size:12px;font-weight:600}
.timer span:last-child{border:1px solid rgba(255,255,255,.6);padding:2px 6px;border-radius:4px}
.btnShare{width:100%;background:#1E3A5F;color:#fff;border:none;border-radius:12px;padding:16px;font-weight:800;font-size:15px;margin:16px 0;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.inputBox{width:100%;background:#fff;border:1.5px solid #D6DDE8;border-radius:12px;padding:12px 14px;display:flex;align-items:center}
.inputBox input{flex:1;border:none;outline:none;font-size:14px;color:#334155}
.inputBox button{border:none;background:none;color:#1E3A5F;font-size:20px;font-weight:800;cursor:pointer}
.apoya{margin-top:22px}
.apoya h3{font-size:16px;color:#2C3E66;display:flex;align-items:center;gap:6px}
.donaBox{background:#E8EEF8;border-radius:12px;padding:16px;margin-top:12px}
.donaBox small{color:#5A6D8A;font-weight:600;font-size:12px}
.aliasRow{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1.5px solid #C5D3E8;border-radius:10px;padding:10px 12px;margin-top:8px}
.aliasRow b{font-size:14px;color:#1E3A5F}
.copyBtn{border:none;background:none;font-size:18px;cursor:pointer}
.footerNav{display:flex;justify-content:space-around;padding:16px 0;border-top:1px solid #EEF2F7;margin-top:30px;color:#8A9BB0}
</style>
</head>
<body>
<div class="app">
<div class="header"><h1>UNIVERSAL<br>SOCIAL DYNAMICS</h1></div>
<div class="content">
<div class="label">Traductor LSA en vivo</div>
<div class="videoBox"><canvas id="c" width="640" height="360"></canvas><div class="badge">EN VIVO • 1080p</div><div class="timer"><span>▶ 00:12 / 01:45</span><span>⛶</span></div></div>
<button class="btnShare" id="btnMain" onclick="compartirVideo()">⎙ COMPARTIR VIDEO LSA</button>
<div class="inputBox"><input id="txt" placeholder="Escribe tu mensaje para traducir a LSA..."><button onclick="enviar()">➤</button></div>
<div id="frase" style="margin:12px 4px;color:#1E3A5F;font-weight:600"></div>
<div class="apoya"><h3>Apoya el proyecto <span style="font-size:14px;color:#8A9BB0">ⓘ</span></h3><div class="donaBox"><small>Alias para donaciones:</small><div class="aliasRow"><b id="alias">universal.lsa.apoyo</b><button class="copyBtn" onclick="navigator.clipboard.writeText('universal.lsa.apoyo');alert('Copiado!')">⎙</button></div><small style="margin-top:8px;display:block;font-size:11px">Tu aporte nos ayuda a mantener la plataforma gratuita y accesible.</small><div style="margin-top:12px;display:flex;gap:8px"><div style="flex:1;background:#fff;border-radius:8px;padding:8px;text-align:center;font-size:12px;font-weight:700">MHERRERA4872.NX.ARS</div><div style="flex:1;background:#fff;border-radius:8px;padding:8px;text-align:center;font-size:12px;font-weight:700">MHERRERA8437.NX.USD</div></div></div></div>
<div class="footerNav"><span>⌂</span><span>💬</span><span>⚙</span></div>
</div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let t=0,blob=null,chunks=[],mr=null,anim=false;
function draw(){
 ctx.fillStyle="#0F172A";ctx.fillRect(0,0,640,360);
 // Avatar profesional tipo foto - dibujo pro mejorado
 ctx.fillStyle="#E8C5A8";ctx.beginPath();ctx.arc(320,120,42,0,6.28);ctx.fill();
 ctx.fillStyle="#1E3A5F";ctx.beginPath();ctx.arc(320,75,46,3.14,6.28);ctx.fill();
 ctx.fillStyle="#DBEAFE";ctx.fillRect(275,165,90,80); // camisa
 ctx.fillStyle="#1E3A5F";ctx.fillRect(235,170,40,110);ctx.fillRect(365,170,40,110); // saco
 ctx.strokeStyle="#1E3A5F";ctx.lineWidth=18;ctx.lineCap="round";
 let s=anim?Math.sin(t*0.08)*20:0;t++;
 ctx.beginPath();ctx.moveTo(255,185);ctx.lineTo(190+s,225);ctx.lineTo(170+s,280);ctx.stroke();
 ctx.beginPath();ctx.moveTo(385,185);ctx.lineTo(410,225);ctx.lineTo(420,250);ctx.stroke();
 ctx.fillStyle="#E8C5A8";ctx.beginPath();ctx.arc(170+s,292,16,0,6.28);ctx.fill();
 ctx.beginPath();ctx.arc(420,262,14,0,6.28);ctx.fill();
 // dedo señalando
 ctx.fillStyle="#E8C5A8";ctx.fillRect(415,235,6,20);
 requestAnimationFrame(draw);
}draw();
function enviar(){
 let v=document.getElementById('txt').value.trim();
 if(!v)return alert("Escribí algo");
 document.getElementById('frase').innerText=v;
 document.getElementById('btnMain').innerText="⏺️ GRABANDO 4s...";
 anim=true;chunks=[];
 try{
  let stream=cv.captureStream(30);
  mr=new MediaRecorder(stream,{mimeType:'video/webm'});
  mr.ondataavailable=e=>chunks.push(e.data);
  mr.onstop=()=>{blob=new Blob(chunks,{type:'video/webm'});document.getElementById('btnMain').innerText="✅ COMPARTIR VIDEO LSA";anim=false};
  mr.start();setTimeout(()=>mr.stop(),4000);
 }catch(e){setTimeout(()=>{document.getElementById('btnMain').innerText="✅ COMPARTIR VIDEO LSA";anim=false},1500)}
}
async function compartirVideo(){
 if(!blob &&!document.getElementById('frase').innerText){alert("Escribí y dale ➤ primero");return}
 let texto=document.getElementById('frase').innerText||"Universal LSA";
 if(blob){
  let f=new File([blob],"universal-lsa.webm",{type:"video/webm"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],text:texto});return}catch(e){}}
 }
 let url="https://marcooo85.github.io/universal-social-dynamics/";
 if(navigator.share){try{await navigator.share({title:"Universal",text:texto,url:url});return}catch(e){}}
 window.open("https://wa.me/?text="+encodeURIComponent(texto+" "+url),"_blank");
}
</script>
</body>
</html>
