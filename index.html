<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universal - Traductor LSA REAL</title>
<style>
*{box-sizing:border-box;font-family:sans-serif;margin:0;padding:0}
body{background:#0a0a12;color:white;text-align:center}
header{background:linear-gradient(90deg,#00c800,#00ff88);color:black;padding:18px;font-weight:bold}
.btn{padding:26px 10px;width:90%;max-width:400px;margin:20px auto;background:#00c800;color:white;border:none;border-radius:18px;font-size:22px;font-weight:bold;display:block}
#videoLSA{width:90%;max-width:500px;height:380px;margin:15px auto;background:#000;border-radius:16px;border:3px solid #00c800;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden}
.sena-letra{font-size:90px;animation:pop 0.3s}
@keyframes pop{0%{transform:scale(0.5)}100%{transform:scale(1)}}
#texto{margin:10px;font-size:20px;min-height:30px}
.palabra{padding:6px 10px;background:#22223a;border-radius:8px;margin:3px;display:inline-block}
</style>
</head>
<body>
<header>🌐 UNIVERSAL SOCIAL DYNAMICS - Traductor LSA con Video</header>
<button id="grabar" class="btn">🎤 TOCAR PARA HABLAR</button>
<div id="texto">Tocá y decí algo: "Hola"</div>
<div id="videoLSA"><span style="font-size:60px">👋</span><p>Acá se verá la traducción en señas</p></div>
<div id="lista"></div>
<script>
const btn=document.getElementById('grabar');
const txt=document.getElementById('texto');
const video=document.getElementById('videoLSA');
const lista=document.getElementById('lista');
let rec; let escuchando=false;

try{
rec=new (window.SpeechRecognition||window.webkitSpeechRecognition)();
rec.lang='es-AR';
rec.interimResults=false;
}catch(e){txt.innerText="Tu navegador no soporta micrófono, probá con Chrome"}

function iniciar(){if(escuchando)return;rec.start()}
function parar(){try{rec.stop()}catch(e){}}

btn.addEventListener('touchstart',e=>{e.preventDefault();iniciar()});
btn.addEventListener('touchend',e=>{e.preventDefault();parar()});
btn.onclick=()=>{escuchando?parar():iniciar()};

rec.onstart=()=>{escuchando=true;btn.innerText="🔴 ESCUCHANDO... SOLTÁ PARA TRADUCIR";btn.style.background="red";txt.innerText="Escuchando...";};
rec.onend=()=>{escuchando=false;btn.innerText="🎤 TOCAR PARA HABLAR";btn.style.background="#00c800";};

rec.onerror=(e)=>{txt.innerText="Error: "+e.error+" - Dale permiso al micrófono arriba en el candadito"};

const diccionarioLSA={
"HOLA":"👋","CHAU":"👋","GRACIAS":"🙏","POR":"🤲","FAVOR":"🙏",
"SI":"👍","NO":"👎","COMO":"🤔","ESTAS":"😊","YO":"👉","TU":"👉",
"AYUDA":"🆘","AGUA":"💧","CASA":"🏠","ESCUELA":"🏫","HOSPITAL":"🏥"
};

rec.onresult=async(e)=>{
 let frase=e.results[0][0].transcript;
 txt.innerHTML="Dijiste: <b>"+frase+"</b>";
 let palabras=frase.toUpperCase().split(" ");
 lista.innerHTML="";
 video.innerHTML="";
 let i=0;
 function mostrarSiguiente(){
  if(i>=palabras.length){video.innerHTML+="<p style='color:#00ff88;margin-top:10px'>✅ Traducción completa</p>";return;}
  let p=palabras[i];
  let emoji=diccionarioLSA[p]|| "🤟";
  video.innerHTML=`<div class=sena-letra>${emoji}</div><h2 style=color:#00ff88>${p}</h2><p style=opacity:0.7>${i+1}/${palabras.length}</p>`;
  let span=document.createElement('span'); span.className='palabra'; span.innerText=p; lista.appendChild(span);
  i++;
  setTimeout(mostrarSiguiente,1200);
 }
 mostrarSiguiente();
};
</script>
</body>
</html>
