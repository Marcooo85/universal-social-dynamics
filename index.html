<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universal - LSA GIF</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif;margin:0;padding:0}
body{background:#000;color:#fff;text-align:center}
header{background:#FF6D00;color:#000;padding:14px;font-weight:900}
#videoBox{width:96%;max-width:520px;height:520px;margin:12px auto 0 auto;background:#000;border:4px solid #fff;border-radius:20px 20px 0 0;position:relative;overflow:hidden}
canvas{width:100%;height:100%}
#btnGif{width:96%;max-width:520px;margin:0 auto 12px auto;background:#FF6D00;color:#000;border:none;border-radius:0 0 20px 20px;padding:18px;font-size:20px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
#texto{margin:10px auto;max-width:520px;background:#111;border-radius:10px;padding:10px;color:#FF6D00;font-weight:900;font-size:18px;min-height:44px}
.btn{width:96%;max-width:520px;padding:16px;margin:7px auto;border:none;border-radius:14px;font-weight:900;font-size:16px;cursor:pointer;display:block}
.btn-accion{background:#e0e0e0;color:#111}
input{width:96%;max-width:520px;padding:14px;border-radius:12px;background:#111;color:#fff;border:2px solid #333;font-size:16px;margin:6px auto;display:block}
.box{width:96%;max-width:520px;margin:14px auto;background:#111;border:1px solid #2a2a2a;padding:16px;border-radius:16px;text-align:left}
</style>
</head>
<body>
<header>UNIVERSAL SOCIAL DYNAMICS - 100% PROPIO</header>

<div id="videoBox">
<canvas id="c"></canvas>
</div>

<button id="btnGif" onclick="compartirVideo()">📤 COMPARTIR VIDEO COMO GIF</button>

<div id="texto">Hola, bienvenidos</div>

<input id="escribir" placeholder="Escribí: hola, gracias, casa">
<button id="btnT" class="btn btn-accion" onclick="generarYGrabar()">GENERAR Y GRABAR LSA ▶️</button>
<button id="grabar" class="btn btn-accion">🎤 HABLAR</button>

<div class="box">
<p style="text-align:center;font-weight:900">🙏 APOYÁ</p>
<div style="display:flex;justify-content:space-between;background:#000;border:1px dashed #555;border-radius:12px;padding:12px;margin:10px 0">
<span style="font-weight:900">MHERRERA4872.NX.ARS</span><button onclick="navigator.clipboard.writeText('MHERRERA4872.NX.ARS');alert('Copiado')" style="background:#FF6D00;border:none;padding:8px 12px;border-radius:8px;font-weight:900">COPIAR</button>
</div>
</div>

<script>
const canvas=document.getElementById('c');const ctx=canvas.getContext('2d');canvas.width=520;canvas.height=520;
let frase="Hola, bienvenidos";let t=0;let grabando=false;
function dibujar(time){
  t=time;
  ctx.fillStyle="#000";ctx.fillRect(0,0,520,520);
  let mov=Math.sin(time/200)*35;let mov2=Math.cos(time/180)*30;
  ctx.strokeStyle="#FF3B30";ctx.lineWidth=8;ctx.lineCap="round";
  ctx.beginPath();ctx.arc(260,110,50,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle="#FF3B30";ctx.beginPath();ctx.arc(240,105,7,0,Math.PI*2);ctx.arc(280,105,7,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#FF3B30";ctx.beginPath();ctx.moveTo(260,160);ctx.lineTo(260,340);ctx.stroke();
  ctx.beginPath();ctx.moveTo(260,190);ctx.lineTo(150+mov,270+mov2);ctx.lineTo(130+mov,330);ctx.stroke();
  ctx.beginPath();ctx.moveTo(260,190);ctx.lineTo(370+mov2,270+mov);ctx.lineTo(390+mov2,330);ctx.stroke();
  ctx.beginPath();ctx.moveTo(260,340);ctx.lineTo(200,460);ctx.moveTo(260,340);ctx.lineTo(320,460);ctx.stroke();
  ctx.fillStyle="#FFD600";ctx.beginPath();ctx.arc(130+mov,340,18,0,Math.PI*2);ctx.arc(390+mov2,340,18,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="rgba(255,255,255,0.2)";ctx.font="900 16px sans-serif";ctx.fillText(frase.substring(0,30),20,500);
  requestAnimationFrame(dibujar);
}
requestAnimationFrame(dibujar);

let mediaRecorder;let chunks=[];let videoBlob=null;
function generarYGrabar(){
  let txt=document.getElementById('escribir').value||"Hola";
  frase=txt;document.getElementById('texto').innerText=txt;
  // Grabar 3 segundos del canvas
  let stream=canvas.captureStream(30);
  chunks=[];mediaRecorder=new MediaRecorder(stream,{mimeType:'video/webm'});
  mediaRecorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
  mediaRecorder.onstop=()=>{
    videoBlob=new Blob(chunks,{type:'video/webm'});
    document.getElementById('btnGif').innerText="✅ VIDEO LISTO - TOCA PARA COMPARTIR COMO GIF";
    document.getElementById('btnGif').style.background="#00D26A";
  };
  mediaRecorder.start();
  setTimeout(()=>mediaRecorder.stop(),3500);
  document.getElementById('btnGif').innerText="⏺️ GRABANDO 3 SEG...";
}

async function compartirVideo(){
  if(!videoBlob){
    alert("Primero apretá GENERAR Y GRABAR");
    return;
  }
  let file=new File([videoBlob],"universal-lsa.webm",{type:"video/webm"});
  // Intento de compartir como archivo real (se ve como video/gif en WhatsApp)
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file],title:"Universal LSA",text:frase});
      return;
    }catch(e){}
  }
  // Fallback: descarga el video y vos lo mandas como video
  let a=document.createElement('a');a.href=URL.createObjectURL(videoBlob);a.download="lsa-"+Date.now()+".webm";a.click();
  alert("Se descargó el video. Ahora andá a WhatsApp y mandalo como VIDEO, se va a ver como GIF moviéndose.");
}

let rec=null;try{rec=new(window.SpeechRecognition||window.webkitSpeechRecognition)();rec.lang='es-AR'}catch{}
if(rec){rec.onresult=e=>{document.getElementById('escribir').value=e.results[0][0].transcript;generarYGrabar()};document.getElementById('grabar').onclick=()=>{try{rec.start()}catch{}};}
</script>
</body>
</html>
