<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNIVERSAL SOCIAL DYNAMICS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;text-align:center}
.caja{margin:8px;border:3px solid #fff;border-radius:22px;overflow:hidden;background:#000;position:relative}
.top{display:flex;justify-content:space-around;padding:12px;background:#111;color:#FFC400;font-weight:900}
.aviso{font-size:12px;padding:8px;color:#ccc;background:#111;border-top:1px solid #222;border-bottom:1px solid #222;text-align:left}
#wrap{height:460px;position:relative;background:#000}
canvas{width:100%;height:100%}
.bolas{position:absolute;right:10px;bottom:70px;display:flex;gap:10px}
.b{width:54px;height:54px;background:#FFC400;border-radius:50%;display:flex;justify-content:center;align-items:center;color:#000;font-size:22px;border:none;cursor:pointer;font-weight:900}
.fr{position:absolute;bottom:5px;left:10px;right:10px;display:flex;justify-content:space-between}
.btn{width:96%;max-width:520px;margin:8px auto;padding:18px;border:none;border-radius:14px;font-weight:900;font-size:16px}
.gris{background:#EAEAEA;color:#111}
input{width:96%;max-width:520px;margin:8px auto;padding:16px;border-radius:12px;background:#111;color:#fff;border:1px solid #333;display:block}
</style>
</head>
<body>
<div class="caja">
<div class="top"><span>English</span>→<span>🇺🇸 American</span></div>
<div class="aviso">ⓘ The latest Sign models are currently in research preview and are not available to the public.</div>
<div id="wrap">
<canvas id="c"></canvas>
<div class="bolas">
<button class="b" onclick="descargar()">⬇️</button>
<button class="b" onclick="compartirDirecto()">↗️</button>
</div>
<div class="fr"><span style="color:#FF6A00">+</span><span id="txt" style="flex:1;font-size:13px;padding-left:6px;text-align:left">El aprendizaje es un tesoro que seguirá a su dueño a cualquier lugar</span><span>🎙️</span></div>
</div>
</div>
<div id="estado" style="color:#FF6A00;font-weight:900;padding:8px">El aprendizaje es un tesoro que seguirá a su dueño a cualquier lugar</div>
<button class="btn gris" onclick="hablar()">🎤 TOCAR PARA HABLAR</button>
<input id="inp" placeholder="Escribí tu frase acá">
<button class="btn gris" onclick="grabarVideo()">GENERAR VIDEO LSA ▶️</button>

<script>
const canvas=document.getElementById('c');const ctx=canvas.getContext('2d');
canvas.width=800;canvas.height=920;
let t=0, anim=false, recorder, chunks=[], blob=null;

function dibujar(){
  ctx.fillStyle="#000";ctx.fillRect(0,0,800,920);
  const cx=400, cy=360;
  ctx.strokeStyle="#FF1A1A";ctx.lineWidth=8;ctx.lineCap="round";
  // cabeza con cara como en tu foto
  ctx.beginPath();ctx.roundRect(cx-65,cy-170,130,105,26);ctx.stroke();
  ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(cx-35,cy-135);ctx.lineTo(cx-15,cy-125);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+15,cy-125);ctx.lineTo(cx+35,cy-135);ctx.stroke();
  ctx.beginPath();ctx.arc(cx-20,cy-115,9,0,7);ctx.stroke();ctx.beginPath();ctx.arc(cx+20,cy-115,9,0,7);ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy-85,16,0.2,2.9);ctx.stroke();
  // cuerpo
  ctx.lineWidth=8;
  ctx.beginPath();ctx.moveTo(cx,cy-65);ctx.lineTo(cx,cy+140);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx,cy-20);ctx.lineTo(cx+150,cy-10);ctx.lineTo(cx+170,cy+140);ctx.stroke();
  // brazo izquierdo con mano de colores
  let hx=cx-150, hy=cy+30;
  if(anim){hx=cx-150+Math.sin(t/10)*25; hy=cy+20+Math.cos(t/9)*15;}
  ctx.beginPath();ctx.moveTo(cx,cy-20);ctx.lineTo(hx,hy);ctx.lineTo(hx-10,hy+130);ctx.stroke();
  if(anim){
    const cols=["#00FF00","#00E5FF","#0066FF","#FFD600","#FF6A00"];
    for(let i=0;i<5;i++){
      ctx.strokeStyle=cols[i];ctx.lineWidth=6;
      ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(hx-30+i*15+Math.sin(t/8+i)*10,hy-50-i*5);ctx.stroke();
    }
    ctx.strokeStyle="#FF1A1A";
    // palma
    ctx.beginPath();ctx.moveTo(hx-25,hy-20);ctx.lineTo(hx+15,hy-30);ctx.lineTo(hx+20,hy+5);ctx.lineTo(hx-10,hy+15);ctx.closePath();ctx.stroke();
  }
  ctx.beginPath();ctx.moveTo(cx,cy+140);ctx.lineTo(cx-70,cy+300);ctx.moveTo(cx,cy+140);ctx.lineTo(cx+70,cy+300);ctx.stroke();
  t++;requestAnimationFrame(dibujar);
}
dibujar();

function grabarVideo(){
  let texto=document.getElementById('inp').value||document.getElementById('txt').innerText;
  document.getElementById('txt').innerText=texto;
  document.getElementById('estado').innerText="⏺️ GRABANDO 3.5 SEG...";
  chunks=[];let stream=canvas.captureStream(30);
  recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9'});
  recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
  recorder.onstop=()=>{
    blob=new Blob(chunks,{type:'video/webm'});
    document.getElementById('estado').innerText="✅ VIDEO LISTO - TOCÁ ↗️ PARA COMPARTIR VIDEO DIRECTO";
    document.getElementById('estado').style.color="#00FF66";
  };
  anim=true;recorder.start();
  setTimeout(()=>{recorder.stop();anim=false;},3500);
}

async function compartirDirecto(){
  if(!blob){alert("Primero GENERAR VIDEO LSA");return;}
  let file=new File([blob],"LSA-video.webm",{type:"video/webm"});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});return;}catch(e){}
  }
  descargar();
}
function descargar(){
  if(!blob){alert("Primero generá");return;}
  let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download="universal-lsa.webm";a.click();
}
function hablar(){
  let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  let r=new SR();r.lang="es-AR";
  r.onresult=e=>{let tx=e.results[0][0].transcript;document.getElementById('inp').value=tx;document.getElementById('txt').innerText=tx;grabarVideo();}
  r.start();document.getElementById('estado').innerText="🎤 Escuchando...";
}
</script>
</body>
</html>
