<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNIVERSAL LSA</title>
<style>body{margin:0;font-family:system-ui;background:#EEF2F7}.top{background:#1E3A5F;color:#fff;padding:20px;text-align:center;font-weight:800}.box{max-width:400px;margin:20px auto;background:#fff;padding:16px;border-radius:14px} canvas{width:100%;height:280px;background:#fff;border-radius:12px;display:block} input{width:70%;padding:12px;border:1.5px solid #ccc;border-radius:8px} button{padding:12px 16px;background:#1E3A5F;color:#fff;border:none;border-radius:8px;font-weight:800}</style>
</head>
<body>
<div class="top">UNIVERSAL SOCIAL DYNAMICS - LSA REAL</div>
<div class="box">
<canvas id="c" width="400" height="280"></canvas>
<div id="pal" style="text-align:center;background:#1E3A5F;color:#fff;padding:8px;border-radius:8px;margin:10px 0;font-weight:800">ESPERANDO</div>
<div style="display:flex;gap:8px"><input id="t" placeholder="Ej: hola buenas noches"><button onclick="go()">➤</button></div>
<div id="log" style="margin-top:12px;background:#E8EEF8;padding:10px;border-radius:8px;font-size:13px">Escribí y dale al botón</div>
</div>
<script>
let g="reposo",t=0,cola=[],i=0;
let c=document.getElementById('c'),x=c.getContext('2d');
function draw(){x.clearRect(0,0,400,280);x.fillStyle="#E8C5A8";x.beginPath();x.arc(200,70,28,0,6.28);x.fill();x.fillStyle="#1E3A5F";x.beginPath();x.arc(200,50,30,3.14,6.28);x.fill();x.fillStyle="#C5D3E8";x.fillRect(165,100,70,70);x.fillStyle="#5B7DB1";x.fillRect(140,102,25,65);x.fillRect(235,102,25,65);x.strokeStyle="#5B7DB1";x.lineWidth=14;x.lineCap="round";let m=Math.sin(t*0.2)*15;if(g=="reposo"){x.beginPath();x.moveTo(152,112);x.lineTo(120,140);x.lineTo(110,175);x.stroke();x.beginPath();x.moveTo(248,112);x.lineTo(280,140);x.lineTo(290,175);x.stroke();}else if(g=="SALUDO"){x.beginPath();x.moveTo(248,112);x.lineTo(290,70+m);x.lineTo(305,50+m);x.stroke();x.beginPath();x.moveTo(152,112);x.lineTo(120,140);x.lineTo(110,175);x.stroke();}else if(g=="ABRAZO"){x.beginPath();x.moveTo(152,112);x.lineTo(80+m,130);x.lineTo(60+m,160);x.stroke();x.beginPath();x.moveTo(248,112);x.lineTo(320-m,130);x.lineTo(340-m,160);x.stroke();}else if(g=="NOCHE"){x.beginPath();x.moveTo(152,112);x.lineTo(180,125);x.lineTo(190,130);x.stroke();x.beginPath();x.moveTo(248,112);x.lineTo(220,125);x.lineTo(210,130);x.stroke();}else{x.beginPath();x.moveTo(152,112);x.lineTo(120+m,140);x.lineTo(110+m,175);x.stroke();x.beginPath();x.moveTo(248,112);x.lineTo(280-m,140);x.lineTo(290-m,175);x.stroke();}x.fillStyle="#E8C5A8";x.beginPath();x.arc(110,175,10,0,6.28);x.fill();x.beginPath();x.arc(290,175,10,0,6.28);x.fill();t++;requestAnimationFrame(draw)}draw();
function go(){let v=document.getElementById('t').value.toLowerCase().trim();if(!v)return;cola=v.split(" ");i=0;next()}
function next(){if(i>=cola.length){document.getElementById('pal').innerText="FIN";g="reposo";return}let p=cola[i];if(p=="hola")g="SALUDO";else if(p=="bienvenidos"||p=="bienvenido")g="ABRAZO";else if(p=="noches"||p=="noche")g="NOCHE";else g="OTRA";document.getElementById('pal').innerText=p.toUpperCase()+" → "+g;document.getElementById('log').innerHTML="Ahora: <b>"+p.toUpperCase()+"</b> = "+g+"<br>Quedan: "+cola.slice(i+1).join(", ");i++;setTimeout(next,1600)}
</script>
</body>
</html>
