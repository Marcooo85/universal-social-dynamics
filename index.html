<!DOCTYPE html>
<html>
<head>
<title>Audio a Señas - By Marco</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="font-family:sans-serif; text-align:center; padding:20px; background:#f5f5f5;">
<h2>🎤 Audio a Lengua de Señas</h2>
<p>Idea Original de Marco - 08/10/2026</p>
<button id="grabar" style="padding:20px; font-size:18px; background:green; color:white; border-radius:12px; border:none;">MANTENER PARA GRABAR</button>
<p id="texto" style="margin-top:20px; font-weight:bold;"></p>
<div id="senas" style="margin-top:20px; font-size:20px; background:white; padding:15px; border-radius:10px;"></div>
<script>
const btn=document.getElementById('grabar');
const textoP=document.getElementById('texto');
const senasDiv=document.getElementById('senas');
let rec=new (window.SpeechRecognition||window.webkitSpeechRecognition)();
rec.lang='es-AR';
btn.onmousedown=()=>{rec.start();textoP.innerText="Escuchando...";};
btn.onmouseup=()=>{rec.stop();};
rec.onresult=(e)=>{
 let t=e.results[0][0].transcript;
 textoP.innerText="Dijiste: "+t;
 senasDiv.innerHTML="🤟 Traduciendo a LSA:<br><b style='font-size:24px;'>"+t.toUpperCase()+"</b><br><br>📹 Aquí va el video con avatar en señas";
};
</script>
</body>
</html>
